# Default profile (dev) — SQLite
spring.datasource.url=jdbc:sqlite:ordermanager.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Server
server.port=5001

# HTTPS enforcement
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:classpath:keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12

# Security
spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD:changeme}

# Static content (Angular app)
spring.web.resources.static-locations=classpath:/static/

# CORS — configurable allowed origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5001}
