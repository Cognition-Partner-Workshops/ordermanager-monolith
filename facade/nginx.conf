# =============================================================================
# Strangler-fig facade for the OrderManager migration (.NET -> Java Spring Boot)
# =============================================================================
# The Angular SPA (client-app/) calls RELATIVE paths (/api/orders, /api/products,
# /api/inventory, /api/customers) against a SINGLE origin. This reverse proxy IS
# that single origin. It lets us cut each route group over from the legacy .NET
# backend to the new Java backend INDEPENDENTLY, without touching any frontend
# URL.
#
# To cut a route group over to Java, change its `proxy_pass` line from
# `dotnet_backend` to `java_backend` and reload nginx. Each such line is tagged
# with a `# ROUTE:<group>` marker so ./flip-route.sh can edit exactly one line.
#
# Run standalone (no root, listens on :8080):
#   nginx -p "$(pwd)/facade" -c nginx.conf              # start
#   nginx -p "$(pwd)/facade" -c nginx.conf -s reload    # apply a route flip
#   nginx -p "$(pwd)/facade" -c nginx.conf -s stop      # stop
#
# Expected backend origins (start these separately):
#   .NET  (legacy) : http://127.0.0.1:5001   (ASPNETCORE_URLS=http://localhost:5001)
#   Java  (target) : http://127.0.0.1:5000   (server.port=5000 in application.yml)
# =============================================================================

worker_processes 1;
error_log stderr info;
pid nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log off;

    # Keep all runtime state under the -p prefix dir so nginx runs without root.
    client_body_temp_path temp/client_body;
    proxy_temp_path        temp/proxy;
    fastcgi_temp_path      temp/fastcgi;
    uwsgi_temp_path        temp/uwsgi;
    scgi_temp_path         temp/scgi;

    # ---- Backend origins ----------------------------------------------------
    upstream dotnet_backend {
        server 127.0.0.1:5001;
    }
    upstream java_backend {
        server 127.0.0.1:5000;
    }

    server {
        listen 8080;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # =====================================================================
        # ROUTING: one route group per /api resource. Flip a group by changing
        # `dotnet_backend` -> `java_backend` on the tagged line, then reload.
        # =====================================================================
        location /api/customers {
            proxy_pass http://dotnet_backend;   # ROUTE:customers  (Phase 1)
        }
        location /api/products {
            proxy_pass http://dotnet_backend;   # ROUTE:products   (Phase 2)
        }
        location /api/inventory {
            proxy_pass http://dotnet_backend;   # ROUTE:inventory  (Phase 3)
        }
        location /api/orders {
            proxy_pass http://dotnet_backend;   # ROUTE:orders     (Phase 4)
        }

        # ---- API docs (follow whichever backend serves the SPA) -------------
        location /swagger {
            proxy_pass http://dotnet_backend;   # ROUTE:spa
        }
        location /v3/api-docs {
            proxy_pass http://dotnet_backend;   # ROUTE:spa
        }

        # ---- SPA + static assets + deep-link fallback -----------------------
        location / {
            proxy_pass http://dotnet_backend;   # ROUTE:spa
        }
    }
}
